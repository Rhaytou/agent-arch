# ============================================================
# POSTGRESQL CONFIGURATION — tuned for pgvector + agent workloads
# ============================================================

# ------------------------------------------------------------
# CONNECTIONS
# ------------------------------------------------------------
listen_addresses = '*'
max_connections = 100

# ------------------------------------------------------------
# MEMORY
# ------------------------------------------------------------
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 512MB

# ------------------------------------------------------------
# PGVECTOR
# ------------------------------------------------------------
shared_preload_libraries = 'vector'

# ------------------------------------------------------------
# WRITE-AHEAD LOG
# ------------------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# ------------------------------------------------------------
# QUERY PLANNER
# ------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# ------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------
log_timezone = 'UTC'
log_min_duration_statement = 500
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# ------------------------------------------------------------
# TIMEZONE
# ------------------------------------------------------------
timezone = 'UTC'




