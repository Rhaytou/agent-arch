# ============================================================
# REDIS CONFIGURATION — tuned for AI agent workloads
# ============================================================

# ------------------------------------------------------------
# NETWORKING
# ------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ------------------------------------------------------------
# SECURITY
# Password is injected at runtime via --requirepass in docker-compose
# Do NOT hardcode it here
# ------------------------------------------------------------

# ------------------------------------------------------------
# PERSISTENCE — AOF for durability
# ------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as secondary backup
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# ------------------------------------------------------------
# MEMORY
# ------------------------------------------------------------
maxmemory 512mb
maxmemory-policy allkeys-lru

# ------------------------------------------------------------
# DATABASE LAYOUT
# db0  → orchestrator task queue (Redis Streams)
# db1  → agent working memory (short-term context)
# db2  → gateway session cache / auth tokens
# db3  → LiteLLM rate limit counters
# db4-15 → reserved
# ------------------------------------------------------------
databases 16

# ------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------
loglevel notice
logfile ""

# ------------------------------------------------------------
# PERFORMANCE
# ------------------------------------------------------------
hz 10
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes








